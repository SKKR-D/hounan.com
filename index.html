<!DOCTYPE html>
<html lang="ja" data-fs="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>販売・決算DX</title>
<!-- QRコード読み取り（バージョン固定）。読み込めなくても商品ボタンで販売できます -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" async></script>
<!-- 値札の二次元コード作成（バージョン固定） -->
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js" async></script>
<style>
:root {
  --fg: #1a1a1a; --bg: #f6f6f3; --card: #ffffff; --line: #b9b9b9; --muted: #4a4a4a;
  --go: #1559b0; --ok: #2b6f2f; --stop: #b3261e; --warn-bg: #fff4c2;
  --mat: #c25400; --lab: #6a1b9a; --exp: #4e5d66; --pro: #2b6f2f; --sal: #1559b0;
}
html { font-size: 21px; }
html[data-fs="s"] { font-size: 18px; }
html[data-fs="l"] { font-size: 25px; }
body {
  margin: 0; color: var(--fg); background: var(--bg); line-height: 1.6;
  font-family: "BIZ UDPGothic", "BIZ UDゴシック", "UD デジタル 教科書体 NK-R", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
}
[hidden] { display: none !important; }
ruby { ruby-align: center; }
rt { font-size: 0.5em; }
html.no-furi rt { display: none; }
h1 { font-size: 1.25rem; margin: 0; text-align: center; }
h2 { font-size: 1.15rem; margin: 20px 0 12px; }
h3 { font-size: 1rem; margin: 12px 0 8px; }
.screen { max-width: 1100px; margin: 0 auto; padding: 0 16px 140px; }
.narrow { max-width: 640px; }
.bar {
  display: grid; grid-template-columns: minmax(120px, auto) 1fr minmax(120px, auto); align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 2px solid var(--line);
}
.bar > :last-child { justify-self: end; }
.who { font-size: 0.85rem; text-align: right; }

.btn {
  min-height: 56px; padding: 8px 18px; font: inherit; font-weight: 700; line-height: 1.3;
  border-radius: 12px; border: 2px solid #333; background: #fff; color: var(--fg); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
}
.btn:focus-visible { outline: 4px solid #e8a400; outline-offset: 2px; }
.btn.go { background: var(--go); border-color: var(--go); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.stop { background: #fff; border-color: var(--stop); color: var(--stop); }
.btn.sm { min-height: 48px; padding: 4px 12px; }
.btn.big { min-height: 72px; font-size: 1.2rem; padding: 8px 28px; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.selected { border-width: 4px; border-color: var(--go); background: #e6eefa; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
.icon { font-size: 1.6rem; }

.actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #fff; border-top: 2px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: flex-end; align-items: center; gap: 16px; flex-wrap: wrap;
}
.actions.static { position: static; border-top: 0; background: transparent; padding: 12px 0; justify-content: flex-start; }
.total-label { font-weight: 700; }
.money { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.huge { font-size: 3rem; }
.neg { color: var(--stop); }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em; }
.note { padding: 12px 16px; border-radius: 10px; border: 2px solid var(--line); background: #fff; }
.note.err { border-color: var(--stop); background: #fdecea; }
.note.ok { border-color: var(--ok); background: #e8f3e8; }
.big { font-size: 1.3rem; font-weight: 700; }
.center { text-align: center; padding-top: 30vh; }
.ver { color: var(--muted); font-size: 0.75rem; text-align: center; margin-top: 40px; }

#banner { position: sticky; top: 0; z-index: 10; background: var(--warn-bg); border-bottom: 3px dashed #8a6d00; text-align: center; font-weight: 800; padding: 6px; }
#banner[hidden] { display: none; }

/* トップ */
.org { text-align: center; margin: 4px 0 0; color: var(--muted); }
.dept { min-height: 96px; flex-direction: column; font-size: 1.1rem; }
.prefs { margin-top: 32px; border: 2px solid var(--line); border-radius: 12px; background: #fff; padding: 8px 16px; }
.prefs summary { cursor: pointer; font-weight: 700; min-height: 48px; display: flex; align-items: center; }
.pref { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
.pref-label { min-width: 8em; font-weight: 700; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.later { margin-top: 28px; color: var(--muted); }
.later li { margin: 4px 0; }
.job { min-height: 88px; font-size: 1.1rem; }

/* レジの進行表示 */
.progress { display: flex; gap: 6px; list-style: none; padding: 0; margin: 10px 0; flex-wrap: wrap; }
.progress li { flex: 1 1 0; min-width: 0; padding: 4px 8px; border: 2px solid var(--line); border-radius: 10px; background: #fff; font-size: 0.85rem; }
@media (max-width: 600px) { .progress { flex-wrap: nowrap; gap: 4px; } .progress li { font-size: 0.62rem; padding: 2px 4px; } }
.progress li.done { background: #eef3fb; }
.progress li[aria-current] { border: 4px solid var(--go); font-weight: 800; }

/* 商品とカゴ */
.reg2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .reg2 { grid-template-columns: 3fr 2fr; } }
.scanrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
#reader { max-width: 380px; width: 100%; }
#reader video { border-radius: 10px; }
.scanmsg { min-height: 2.6em; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--line); background: #fff; }
.scanmsg.ok { border-color: var(--ok); background: #e8f3e8; }
.scanmsg.err { border-color: var(--stop); background: #fdecea; }
.prods { margin-top: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.prod { min-height: 110px; flex-direction: column; gap: 2px; }
.prod .pname { font-size: 1rem; }
.prod .pprice { font-size: 1.05rem; }
.prod.flash { outline: 4px solid var(--ok); background: #e8f3e8; }
.cartcol { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; align-self: start; }
.lines { list-style: none; padding: 0; margin: 0; }
.line { border-bottom: 1px solid var(--line); padding: 8px 0; }
.line:last-child { border-bottom: 0; }
.lname { font-weight: 700; }
.lbtns { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

/* お金 */
.sum3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kv { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; }
.kv .k { font-weight: 700; }
.cash { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; align-items: center; }
.note-btn { min-width: 170px; min-height: 80px; border-radius: 6px; background: #f3f8ec; }
.coin-btn { width: 100px; height: 100px; border-radius: 50%; background: #fbf6e6; padding: 0; }
.status { font-weight: 700; }

/* 確認と完了 */
.sum { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.sum dt { font-weight: 700; }
.sum dd { margin: 0; text-align: right; }
.done-box { text-align: center; background: #fff; border: 3px solid var(--ok); border-radius: 16px; padding: 20px; margin-top: 20px; }
.coins { list-style: none; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.coins li { border: 2px solid var(--line); border-radius: 10px; padding: 6px 14px; background: #fafafa; font-weight: 700; }

/* 決算 */
.pl { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 4px 16px; }
.pl-row { display: grid; grid-template-columns: 2rem 1fr auto; gap: 8px 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.pl-row:last-child { border-bottom: 0; }
.pl-row.total { border-top: 3px double var(--fg); }
.pl-sign { font-size: 1.5rem; font-weight: 800; text-align: center; }
.pl-name { font-weight: 800; font-size: 1.1rem; }
.pl-expl { color: var(--muted); font-size: 0.9rem; }
.pl-amt { text-align: right; }
.pl-detail { font-size: 0.9rem; margin: 6px 0 0; padding-left: 1.2em; }
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 12px 0; }
.chart { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 16px; }
.chart > svg { width: 100%; height: auto; display: block; }
.legend { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 8px 0 0; }
.legend li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
@media (max-width: 600px) { .legend li { white-space: normal; } }
.legend svg { width: 22px; height: 22px; flex: none; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 8px; font-weight: 800; border: 2px solid currentColor; margin-top: 4px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- フェーズ2で追加 ---------- */
.btn.danger { background: var(--stop); border-color: var(--stop); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chips .btn { min-width: 110px; }
.counter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
.counter .k { font-weight: 800; min-width: 9em; }
.counter .v { font-size: 2rem; font-weight: 800; min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
.meter { height: 12px; background: #e4e4e4; border-radius: 6px; overflow: hidden; margin-top: 4px; width: 100%; }
.meter > i { display: block; height: 100%; background: var(--ok); }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.list .btn { width: 100%; justify-content: flex-start; text-align: left; flex-wrap: wrap; }
.tag-voided { color: var(--stop); font-weight: 800; }
table.tbl { width: 100%; border-collapse: collapse; background: #fff; }
table.tbl th, table.tbl td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.tbl thead th { background: #eef0f2; }
table.tbl td.num, table.tbl th.num { white-space: nowrap; }
/* はじめの画面 */
.hub { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 16px 0; }
.btn.hubcard { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 6px; padding: 18px; min-height: 150px; }
.btn.hubcard .icon { font-size: 2.2rem; }
.btn.hubcard .ttl { font-size: 1.3rem; font-weight: 800; }
.btn.hubcard .desc { font-size: 0.9rem; font-weight: 400; color: #444; line-height: 1.5; }
.hub-resume { width: 100%; margin-top: 10px; }
.btn.evbtn { display: flex; flex-direction: column; gap: 4px; }
.btn.evbtn small, .jobdesc { font-weight: 400; font-size: 0.8rem; display: block; }
.qitem { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.qstep { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.qstep .btn { min-height: 48px; min-width: 56px; padding: 2px 8px; white-space: nowrap; }
.qstep .v { min-width: 5.5em; text-align: center; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
/* 1画面レジ：画面の高さに ぴったり おさめる（スクロールしない） */
.qreg { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--bg, #f6f6f2); }
.qbar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 2px solid var(--line); background: #fff; flex: none; min-width: 0; }
.qbar .btn { min-height: 44px; padding: 2px 10px; font-size: 0.95rem; white-space: nowrap; flex: none; }
.qtitle { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; overflow: hidden; }
.qtitle > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qtitle b { font-size: 1.15rem; }
.qtitle small, .qstatus { font-size: 0.85rem; color: #555; }
.qstatus { color: #8a4b00; font-weight: 700; }
.qstatus:empty { display: none; }
.qmain { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 8px; padding: 8px; }
.qleft, .qright { min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.qcam, #reader.qcam { flex: 1; min-height: 120px; width: 100%; max-width: none; margin: 0; background: #222; border-radius: 10px; overflow: hidden; position: relative; }
.qcam video { width: 100% !important; height: 100% !important; object-fit: cover; }
.qleft .scanmsg { margin: 0; flex: none; font-size: 0.9rem; min-height: 0; padding: 4px 10px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.qprods { flex: none; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.qprods .btn { flex: none; min-height: 52px; padding: 4px 10px; font-size: 0.95rem; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.qprods .btn small { font-weight: 400; font-size: 0.8rem; }
.qcarthead { display: flex; align-items: center; gap: 8px; flex: none; white-space: nowrap; }
.qcarthead .qtotal { flex: 1; text-align: right; font-size: 1.1rem; }
.qcarthead .btn { min-height: 38px; padding: 2px 10px; font-size: 0.9rem; }
.qcart { flex: 1; min-height: 60px; overflow-y: auto; background: #fff; border: 2px solid var(--line); border-radius: 10px; }
.qline { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 44px 44px 44px; align-items: center; gap: 4px 6px; padding: 4px 8px; border-bottom: 1px solid #e3e3e3; }
.qline .btn { min-height: 40px; min-width: 40px; padding: 0; }
.qn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qn small { color: #555; font-weight: 400; }
.qq, .qs { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qdone { padding: 12px; text-align: center; color: var(--ok); font-weight: 700; }
.qdone .big b { font-size: 2rem; }
.qpay { flex: none; display: flex; flex-direction: column; gap: 6px; }
.qkvs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.qkv { background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 1px 8px; display: flex; flex-direction: column; min-width: 0; }
.qkv span { font-size: 0.78rem; color: #555; display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; }
.qclear { font: inherit; font-size: 0.8rem; min-width: 28px; border: 1px solid var(--stop); color: var(--stop); background: #fff; border-radius: 6px; padding: 0 4px; cursor: pointer; }
.qkv b { font-size: 1.3rem; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qkv.ok b { color: var(--ok); }
.qkv.ng b { color: var(--stop); }
.qcash { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.qcash .btn { min-height: 46px; padding: 0 2px; font-size: 1.05rem; white-space: nowrap; }
.qcash .btn.bill { background: #eef5ff; }
.qcash .btn.coin { background: #fff8e6; }
.btn.qgo { min-height: 58px; font-size: 1.25rem; width: 100%; }
/* たてながの画面（スマホ・たてにした iPad）：上から カメラ → カゴ → お金 */
@media (max-width: 760px), (orientation: portrait) and (max-width: 1100px) {
  .qmain { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .qcam { flex: none; height: 22vh; height: 22dvh; min-height: 105px; }
  .qprods .btn { min-height: 42px; flex-direction: row; gap: 6px; }
  .qleft .scanmsg { -webkit-line-clamp: 1; }
}
@media (max-width: 420px) {
  .qcash .btn { min-height: 42px; font-size: 0.95rem; }
  .qkv b { font-size: 1.05rem; }
  .btn.qgo { min-height: 52px; font-size: 1.1rem; }
  .qbar .btn { min-height: 40px; padding: 2px 8px; }
  .qtitle b { font-size: 1rem; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .qtitle small { display: none; }
}
/* よこながで 高さが ひくい 画面（スマホを よこに した とき） */
@media (max-height: 460px) {
  .qtitle { flex-direction: row; align-items: baseline; gap: 8px; }
  .qmain { padding: 4px 8px; gap: 6px; }
  .qbar .btn { min-height: 38px; }
  .qcash .btn { min-height: 38px; }
  .btn.qgo { min-height: 44px; font-size: 1.05rem; }
  .qkv b { font-size: 1.05rem; }
  .qprods .btn { min-height: 40px; flex-direction: row; gap: 6px; }
  .qleft .scanmsg { -webkit-line-clamp: 1; }
}
ul.cards { list-style: none; padding: 0; display: grid; gap: 12px; }
.drill-q { font-size: 1.35rem; font-weight: 700; line-height: 1.7; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 14px 18px; }
.drill-ans { display: flex; align-items: baseline; gap: 8px; font-size: 1.4rem; font-weight: 800; margin: 10px 0; }
.drill-ans .v { min-width: 6em; text-align: right; font-size: 2.2rem; border-bottom: 4px solid #333; padding: 0 8px; font-variant-numeric: tabular-nums; }
.drill-exp { background: #fffbe6; border: 2px solid #e8c400; border-radius: 12px; padding: 12px 16px; line-height: 1.7; }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(72px, 110px)); gap: 8px; margin: 10px 0; }
.keypad .btn { font-size: 1.5rem; min-height: 64px; }
li.card { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.counters .counter { margin-bottom: 6px; }
.chart > svg { width: 100%; height: auto; max-width: 720px; }
@media (max-width: 600px) {
  .bar { grid-template-columns: auto 1fr auto; gap: 8px; }
  .bar h1 { font-size: 1.2rem; }
  table.tbl { font-size: 0.85rem; }
  table.tbl th, table.tbl td { padding: 5px 5px; }
}
.pin { font: inherit; font-size: 1.6rem; letter-spacing: 0.3em; width: 9em; padding: 8px 12px; border: 3px solid #333; border-radius: 10px; }
.field { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.field label { min-width: 8em; font-weight: 700; }
.field input[type=number], .field input[type=date] { font: inherit; width: 6.5em; padding: 6px 8px; border: 2px solid #333; border-radius: 8px; }
.denoms { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 8px; }
.denom { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.denom > * { white-space: nowrap; }
.denom .k { min-width: 6.5em; font-weight: 800; }
.denom input { font: inherit; width: 3.6em; padding: 4px 6px; border: 2px solid #333; border-radius: 8px; text-align: right; }
.denom .amt { margin-left: auto; }
.panel { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px 16px; margin: 14px 0; }
.panel h3 { margin-top: 4px; }
.timer { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.slots { display: inline-grid; gap: 3px; margin: 6px 0; }
.slots .btn { min-height: 40px; min-width: 44px; padding: 2px 6px; font-size: 0.8rem; }

/* 印刷（値札ラベル・手書き用紙） */
#print-area { display: none; }
.preview { border: 2px solid var(--line); background: #ddd; overflow: hidden; margin: 8px 0; }
.preview .sheet { transform-origin: 0 0; box-shadow: 0 0 0 1px #999; }
.sheet { position: relative; width: 210mm; height: 297mm; overflow: hidden; background: #fff; color: #000; break-after: page; page-break-after: always; }
.sheet:last-child { break-after: auto; page-break-after: auto; }
.lbl { position: absolute; box-sizing: border-box; display: flex; align-items: center; gap: 1.2mm; padding: 1.2mm; overflow: hidden; color: #000;
  font-family: "BIZ UDPGothic", "Hiragino Sans", "Meiryo", sans-serif; }
.lbl.frame { outline: 0.25mm dashed #555; outline-offset: -0.125mm; }
.lbl .qr { flex: none; display: block; }
.lbl .t { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; line-height: 1.15; }
.lbl .t > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbl .i { font-family: ui-monospace, Menlo, Consolas, monospace; }

<body>
<div id="banner" hidden></div>
<div id="app"></div>
<div id="print-area"></div>
<noscript><p class="note err">JavaScript を有効にしてください。</p></noscript>

<script>
'use strict';

/* ==== ここだけ書き換える ==== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwo1wik8mNABw63NCTB69y0wofilZZLcUTfL3NXKCduYIiakRyoBKt9ADdERuRAE3w4/exec';
/* ============================ */

const APP_VERSION = '4.0.0-quick';
const TIMEOUT_MS = 15000;

/* ---------- 保存（使えない端末でも止まらないように） ---------- */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem('sdx_' + key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) { try { localStorage.setItem('sdx_' + key, JSON.stringify(value)); } catch (e) { /* 無視 */ } },
};

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* ---------- 状態 ---------- */
const S = {
  screen: 'loading',
  storeCode: store.get('storeCode', ''),
  deviceId: store.get('deviceId', '') || (() => { const id = 'D-' + uuid().slice(0, 8); store.set('deviceId', id); return id; })(),
  prefs: Object.assign({ fs: 'm', sound: true, level: null }, store.get('prefs', {})),
  prefsOpen: false,
  init: null,          // サーバーの init 応答（端末にも保存し、つながらないときに使う）
  sold: new Set(),     // 販売済みの値札（個体ID）
  offline: false,      // 前回のデータで動いているか
  queue: store.get('queue', []),     // 未送信の決済
  timers: store.get('timers', []),   // この端末で動いているタイムカード
  register: store.get('register', null),   // この端末で開いたレジ（販売形態・売場・レジ名・釣銭準備金）
  adminPin: null,      // 管理者の暗証番号（画面を閉じるまで覚える）
  dept: null, msg: null,
  reg: null, dash: null, pd: null, lab: null, labList: null, tc: null, vd: null, sales: null, cl: null, adm: null, ro: null,
};
const REF = { step2: null };

/* ---------- DOM ヘルパー（文字は必ず textContent として入れる） ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  appendKids(el, kids);
  return el;
}
function appendKids(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
}
function rb(base, reading) { return h('ruby', null, base, h('rt', null, reading)); }
function yen(n) { const v = Math.round(n || 0); return (v < 0 ? '▲' : '') + Math.abs(v).toLocaleString('ja-JP') + '円'; }
function yenNode(n) { return h('span', { class: n < 0 ? 'neg' : null }, yen(n)); }
function backBtn(fn, disabled) { return h('button', { class: 'btn stop', onclick: fn, disabled: !!disabled }, '◀ もどる'); }
function versionLine() { return h('p', { class: 'ver' }, '画面 ' + APP_VERSION + ' ／ サーバー ' + ((S.init && S.init.version) || '―') + ' ／ たんまつ ' + S.deviceId); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function prod(id) { return S.init.products.find(p => p.id === id); }
function memberName(id) { const m = S.init.members.find(x => x.id === id); return m ? m.name : id; }
function settings() { return S.init.settings; }
function canOversell() { return settings().allowOversell || settings().practiceMode; }
/* ---------- 学科（科）・販売形態・レジ ---------- */
const BOOTH_ALL = '全体';
function schoolDepts() { return settings().schoolDepts || []; }
function channels() { return settings().channels || []; }
function localDate() { const d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function hasOpenRegister() { const r = S.register; return !!(r && r.date === localDate() && r.status !== '締め済み'); }
function saveRegister() { store.set('register', S.register); }
/** この売場で売れる製品か（峰南祭の科のレジでは、その科の製品だけ） */
function inBooth(p) { const r = S.register; return !r || !r.booth || r.booth === BOOTH_ALL || p.dept === r.booth; }
function boothProducts() { return S.init.products.filter(inBooth); }
function registerLabel() { const r = S.register; return r ? r.registerName + '（' + r.channel + (r.booth && r.booth !== BOOTH_ALL ? '・' + r.booth : '') + '）' : ''; }

function note(type, text) { return h('p', { class: 'note ' + type, role: type === 'err' ? 'alert' : 'status' }, text); }
/** 画面の共通の枠：見出し・もどる・本文 */
function page(title, onBack, ...kids) {
  return h('div', { class: 'screen' },
    h('header', { class: 'bar' }, onBack ? backBtn(onBack) : h('span'), h('h1', null, title), h('span')),
    ...kids);
}
function actions(...kids) { return h('div', { class: 'actions' }, ...kids); }
/** えらぶボタンの並び（選んだものに ✓ と太い枠） */
function chips(options, current, onPick, label) {
  return h('div', { class: 'chips', role: 'group', 'aria-label': label || null },
    options.map(([value, text]) => h('button', {
      class: 'btn' + (current === value ? ' selected' : ''), 'aria-pressed': String(current === value), onclick: () => onPick(value),
    }, current === value ? '✓ ' : '', text)));
}
/** ＋－ボタンで数を入れる */
function counter(label, value, onChange, opts) {
  const o = Object.assign({ min: 0, max: 999, steps: [-10, -1, 1, 10], unit: 'こ' }, opts || {});
  const set = v => onChange(Math.max(o.min, Math.min(o.max, v)));
  return h('div', { class: 'counter', role: 'group', 'aria-label': o.name || (typeof label === 'string' ? label : null) },
    h('span', { class: 'k' }, label),
    o.steps.filter(s => s < 0).map(s => h('button', { class: 'btn sm', onclick: () => set(value + s), disabled: value <= o.min, 'aria-label': (-s) + ' へらす' }, '－' + (-s))),
    h('span', { class: 'v', 'aria-live': 'polite' }, value, h('small', null, o.unit)),
    o.steps.filter(s => s > 0).map(s => h('button', { class: 'btn sm', onclick: () => set(value + s), disabled: value >= o.max, 'aria-label': s + ' ふやす' }, '＋' + s)));
}
/** ステップの進行表示 */
function progressBar(labels, step) {
  return h('ol', { class: 'progress', 'aria-label': 'すすみぐあい' }, labels.map((label, i) => {
    const n = i + 1;
    return h('li', { class: n < step ? 'done' : null, 'aria-current': n === step ? 'step' : null },
      n < step ? '✓ ' : n === step ? '▶ ' : '', n, ' ', typeof label === 'function' ? label() : label);
  }));
}
const DENOM_ALL = [10000, 5000, 2000, 1000, 500, 100, 50, 10, 5, 1];
function breakdown(n) {
  const out = [];
  let rest = n;
  DENOM_ALL.filter(v => v !== 2000).forEach(v => { const c = Math.floor(rest / v); if (c > 0) { out.push([v, c]); rest -= c * v; } });
  return out;
}
function coinList(n) {
  return h('ul', { class: 'coins', 'aria-label': 'わたす おかね' },
    breakdown(n).map(([v, c]) => h('li', null, v >= 1000 ? '💴 ' : '🪙 ', v.toLocaleString('ja-JP'), '円 × ', c, 'まい')));
}

/* ---------- 表示の設定 ---------- */
/* 対象レベル：1＝小学生 2＝中学・高校 3＝社会人・プロ。全体の きまり（設定）と、この端末だけの きりかえ */
const LEVELS = { 1: '小学生', 2: '中学・高校', 3: '社会人・プロ' };
function storeLevel() { return (S.init && S.init.settings && S.init.settings.level) || 1; }
function effLevel() { return S.prefs.level || storeLevel(); }
/** ふりがな：この端末で えらんで いなければ、レベル3 だけ なし */
function furiganaOn() { return S.prefs.furiganaSet ? S.prefs.furigana !== false : effLevel() < 3; }
function applyFurigana() { document.documentElement.classList.toggle('no-furi', !furiganaOn()); }
function applyPrefs() {
  document.documentElement.dataset.fs = S.prefs.fs;
  applyFurigana();
  store.set('prefs', S.prefs);
}

/* ---------- 音と振動 ---------- */
let audioCtx = null;
function beep(ok) {
  if (!S.prefs.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const tone = (freq, start, len, type) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0 + start);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + len);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + start); o.stop(t0 + start + len + 0.02);
    };
    if (ok) tone(1320, 0, 0.09, 'sine');                                    // 「ピッ」
    else { tone(330, 0, 0.14, 'square'); tone(260, 0.17, 0.2, 'square'); }   // 「ブブー」
  } catch (e) { /* 音が出せなくても続ける */ }
}
document.addEventListener('pointerdown', () => {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { /* 無視 */ }
}, { once: true });
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 無視 */ } }

/* ---------- 通信 ---------- */
function isConfigured() {
  return /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[^/]+\/exec$/.test(GAS_URL);
}
function appError(code, message, data) { const e = new Error(message); e.code = code; e.data = data; return e; }

async function api(method, action, payload) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    let res;
    if (method === 'GET') {
      const q = new URLSearchParams(Object.assign({ action: action, storeCode: S.storeCode, deviceId: S.deviceId }, payload || {}));
      res = await fetch(GAS_URL + '?' + q.toString(), { signal: ctrl.signal });
    } else {
      // text/plain で送ると、ブラウザの事前確認（プリフライト）が起きない
      res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action, storeCode: S.storeCode, deviceId: S.deviceId }, payload || {})),
        signal: ctrl.signal,
      });
    }
    const json = await res.json();
    if (!json.ok) throw appError(json.error.code, json.error.message, json.error.data);
    if (S.offline) { S.offline = false; updateBanner(); }
    return json.data;
  } catch (e) {
    if (typeof e.code === 'string') throw e;
    throw appError('NETWORK', 'つうしん できませんでした。Wi-Fi を たしかめて、もういちど ためしてください。');
  } finally {
    clearTimeout(timer);
  }
}
/** 暗証番号がちがうと返ってきたら、覚えていた番号を忘れる */
function forgetPinIfBad(e) { if (e.code === 'BAD_PIN') S.adminPin = null; }
/** 店舗コードが変わったら入れ直してもらう */
function toCodeScreen() {
  S.storeCode = ''; store.set('storeCode', '');
  S.msg = '店舗コードが かわりました。もういちど いれてください。';
  go('code');
}

/* ---------- 在庫・ロット・販売済みの値札をまとめて更新 ---------- */
function applySync(d) {
  if (!d || !S.init) return;
  if (d.stock) S.init.products.forEach(p => { if (d.stock[p.id] !== undefined) p.stock = d.stock[p.id]; });
  if (d.lots) S.init.lots = d.lots;
  if (d.soldTags) { S.sold = new Set(d.soldTags); S.init.soldTags = d.soldTags; }
  store.set('init', S.init);
  const R = REF.step2;
  if (R) R.prodGrid.replaceChildren(...boothProducts().map(productButton));
}
async function refreshStock() {
  try { applySync(await api('GET', 'stock')); } catch (e) { /* 次の決済で確かめられるので無視 */ }
}

/* ---------- 画面の切り替え ---------- */
const VIEWS = {};
function updateBanner() {
  const banner = document.getElementById('banner');
  const parts = [];
  if (S.init && settings().practiceMode) parts.push('✏ れんしゅう ちゅう（この きろくは 決算に はいりません）');
  if (S.offline) parts.push('📴 オフライン：まえに よみこんだ データで うごいています');
  const waiting = S.queue.filter(q => q.status === 'waiting' && (S.offline || Date.now() - Date.parse(q.clientTime) > 30000)).length;
  const failed = S.queue.filter(q => q.status === 'error').length;
  if (waiting) parts.push('📤 まだ おくっていない とりひき ' + waiting + 'けん（つながると じどうで おくります）');
  if (failed) parts.push('⚠ おくれなかった とりひき ' + failed + 'けん（せんせいに つたえてください）');
  banner.hidden = !parts.length;
  banner.textContent = parts.join('　／　');
}
function render() {
  updateBanner();
  applyFurigana();
  const app = document.getElementById('app');
  app.replaceChildren(VIEWS[S.screen]());
  localize(app);
  localize(document.getElementById('banner'));
}
function go(screen) {
  if (qr && screen !== 'register' && screen !== 'qreg') stopCamera();
  if (screen !== 'qreg') REF.q = null;
  S.screen = screen;
  render();
  window.scrollTo(0, 0);
}

async function boot() {
  applyPrefs();
  if (!isConfigured()) {
    S.msg = 'GAS_URL が設定されていません。index.html の いちばん うえにある GAS_URL に、ウェブアプリの URL（https://script.google.com/…/exec）を はりつけてください。';
    return go('error');
  }
  if (!S.storeCode) return go('code');
  go('loading');
  try {
    const data = await api('GET', 'init');
    S.init = data; S.offline = false;
    S.sold = new Set(data.soldTags || []);
    store.set('init', data);
    const local = S.register;
    S.register = data.register || (local && local.practice && local.date === localDate() ? local : null);
    if (S.register && local && local.quick && local.date === S.register.date && local.registerName === S.register.registerName) S.register.quick = true;
    saveRegister();
    S.msg = null;
    go('hub');
    flushQueue();
  } catch (e) {
    if (e.code === 'UNAUTHORIZED') {
      S.storeCode = ''; store.set('storeCode', '');
      S.msg = '店舗コードが ちがいます。もういちど いれてください。';
      return go('code');
    }
    const cached = store.get('init', null);
    if (e.code === 'NETWORK' && cached) {
      // つながらなくても、前回のデータでレジを開けるようにする（10.1）
      S.init = cached; S.offline = true;
      S.sold = new Set(cached.soldTags || []);
      go('hub');
      return;
    }
    S.msg = e.message;
    go('error');
  }
}

/* ---------- 未送信キュー（10.1） ---------- */
function saveQueue() { store.set('queue', S.queue); updateBanner(); }
function enqueue(payload, total) {
  if (S.queue.some(q => q.txId === payload.txId)) return;
  S.queue.push({ txId: payload.txId, payload: payload, clientTime: new Date().toISOString(), total: total, status: 'waiting', msg: '' });
  saveQueue();
}
let flushing = false;
async function flushQueue() {
  if (flushing || !S.init || !S.queue.some(q => q.status === 'waiting')) return;
  flushing = true;
  try {
    for (let round = 0; round < 50; round++) {
    const batch = S.queue.filter(x => x.status === 'waiting');
    if (!batch.length) break;
    let stop = false;
    for (const q of batch) {
      try {
        const d = await api('POST', 'checkout', Object.assign({}, q.payload, { queued: true, clientTime: q.clientTime }));
        S.queue = S.queue.filter(x => x.txId !== q.txId);
        saveQueue();
        applySync(d);
      } catch (e) {
        if (['NETWORK', 'BUSY', 'SERVER', 'UNAUTHORIZED'].indexOf(e.code) >= 0) { stop = true; break; }   // あとでもう一度
        q.status = 'error'; q.msg = e.message;                                             // 内容の問題は管理者に見てもらう
        saveQueue();
      }
    }
    if (stop) break;
    }
  } finally {
    flushing = false;
    updateBanner();
    if (S.screen === 'admin') render();
  }
}
window.addEventListener('online', () => { flushQueue(); refreshStock(); });
setInterval(flushQueue, 20000);

/* =====================================================================
 * 画面：読み込み・エラー・店舗コード
 * ===================================================================== */
VIEWS.loading = () => h('div', { class: 'screen center' }, h('p', { class: 'big', role: 'status' }, 'よみこみ ちゅう…'));

VIEWS.error = () => h('div', { class: 'screen narrow' },
  h('header', { class: 'bar' }, h('span'), h('h1', null, 'うまく いきませんでした'), h('span')),
  note('err', S.msg || 'エラーが おきました。'),
  h('div', { class: 'row' },
    h('button', { class: 'btn go', onclick: boot }, '🔄 もういちど'),
    isConfigured() ? h('button', { class: 'btn stop', onclick: () => { S.storeCode = ''; store.set('storeCode', ''); S.msg = null; go('code'); } }, '店舗コードを いれなおす') : null),
  versionLine());

VIEWS.code = () => {
  const input = h('input', {
    id: 'code', type: 'text', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false',
    value: S.storeCode || '', 'aria-describedby': 'codehelp',
    style: 'font:inherit;font-size:1.6rem;letter-spacing:0.1em;width:100%;box-sizing:border-box;padding:12px;border:3px solid #333;border-radius:10px;margin:8px 0',
  });
  const submit = () => {
    const v = input.value.trim().toUpperCase();
    if (!v) { input.focus(); return; }
    S.storeCode = v; store.set('storeCode', v); boot();
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  setTimeout(() => input.focus(), 0);
  return h('div', { class: 'screen narrow' },
    h('header', { class: 'bar' }, h('span'), h('h1', null, rb('店舗', 'てんぽ'), 'コード'), h('span')),
    S.msg ? note('err', S.msg) : null,
    h('label', { for: 'code', class: 'big' }, 'せんせいから きいた ', rb('店舗', 'てんぽ'), 'コードを いれてください'),
    input,
    h('p', { id: 'codehelp', class: 'muted' }, 'この たんまつに おぼえさせるので、つぎからは いれなくて だいじょうぶです。'),
    actions(h('button', { class: 'btn go big', onclick: submit }, 'はじめる ▶')));
};

/* =====================================================================
 * 画面：トップ（部門をえらぶ）と部門の画面
 * ===================================================================== */
const JOBS = {
  dashboard: { icon: '📊', label: () => [rb('決算', 'けっさん'), 'を みる'], open: () => openDashboard() },
  register: { icon: '🧾', label: () => 'レジ', open: () => openRegister() },
  sales: { icon: '📋', label: () => 'うれた きろく', open: () => openSales() },
  void: { icon: '↩', label: () => [rb('取消', 'とりけし')], open: () => openVoid() },
  production: { icon: '🔨', label: () => 'つくった かずの きろく', open: () => openProduction() },
  labels: { icon: '🏷', label: () => 'ねふだの いんさつ', open: () => openLabelList() },
  timecard: { icon: '⏱', label: () => 'タイムカード', open: () => openTimecard() },
  closing: { icon: '🔒', label: () => 'レジじめ', open: () => openClosing(), when: () => settings().useCashClosing },
  expense: { icon: '💴', label: () => [rb('経費', 'けいひ'), 'の きろく'], open: () => openExpense() },
  plan: { icon: '💡', label: () => ['ねだんと うれる かずの ', rb('予想', 'よそう')], open: () => openPlan() },
  drill: { icon: '✏', label: () => 'れんしゅう もんだい', open: () => openDrill(S.dept) },
};
const DEPTS = {
  '経営': { icon: '🏢', label: () => rb('経営', 'けいえい'), jobs: ['dashboard', 'plan', 'drill', 'timecard'], later: [] },
  '商品企画': { icon: '💡', label: () => [rb('商品', 'しょうひん'), rb('企画', 'きかく')], jobs: ['plan', 'drill', 'timecard'], later: [] },

function scanFeedback(ok, text) {

  const R = camRefs();

  R.scanMsg.textContent = (ok ? '✓ ' : '✖ ') + text;
}

/** カゴに1こ入れる。tag があれば値札（個体ID）として入れる */
function addToCart(id, tag) {
  const p = prod(id);
  if (!p) { scanFeedback(false, 'この コードは しょうひんに ありません。'); return; }
  if (!inBooth(p)) { scanFeedback(false, p.name + 'は この うりば（' + S.register.booth + '）の しょうひん では ありません（' + (p.dept || '科なし') + '）。'); return; }
  let line = S.reg.cart.find(l => l.id === id);
  const inCart = line ? line.qty : 0;
  if (!canOversell() && inCart + 1 > p.stock) {
    scanFeedback(false, p.name + 'は これいじょう ありません（のこり ' + Math.max(0, p.stock) + 'こ）。');
    return;
  }
  if (!line) { line = { id: id, qty: 0, tags: [] }; S.reg.cart.push(line); }
  line.qty += 1;
  if (tag) line.tags.push(tag);
  let extra = '';
  if (tag) {
    const lot = S.init.lots[tag.slice(0, tag.lastIndexOf('-'))];
    if (lot && lot.price && lot.price !== p.price) extra = ' ねふだの ねだん（' + yen(lot.price) + '）と いまの ねだん（' + yen(p.price) + '）が ちがいます。いまの ねだんで うります。';
  }
  scanFeedback(true, p.name + 'を カゴに いれました（' + line.qty + 'こ）。' + extra);
  if (REF.q) { qRefresh(); return; }
  updateCart();
  const btn = REF.step2 && REF.step2.prodGrid.querySelector('[data-id="' + CSS.escape(id) + '"]');
  if (btn) { btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 500); }
}
function changeQty(id, delta) {
  const line = S.reg.cart.find(l => l.id === id);
  if (!line) return;
  if (delta > 0) { addToCart(id, null); return; }
  if (line.qty <= 1) return;
  if (line.qty === line.tags.length) line.tags.pop();   // 値札の分しかなければ、最後に読んだ値札を外す
  line.qty -= 1;
  if (REF.q) qRefresh(); else updateCart();
}
function removeLine(id) {
  S.reg.cart = S.reg.cart.filter(l => l.id !== id);
  if (REF.q) qRefresh(); else updateCart();
}

/** 読み取った文字：値札（個体ID）か、商品IDか */
function onScan(text) {
  const code = String(text).trim();
  const now = Date.now();
  if (code === lastScan.text && now - lastScan.t < 2000) return;   // 同じコードの連続読み取りを防ぐ
  lastScan = { text: code, t: now };
  handleCode(code);
}
function handleCode(code) {
  if (TAG_RE.test(code)) {
    if (cartTags().indexOf(code) >= 0) { scanFeedback(false, 'この ねふだは もう よみました。'); return; }
    if (S.sold.has(code)) { scanFeedback(false, 'この ねふだの しょうひんは もう うれています。せんせいに みせてください。'); return; }
    const lot = S.init.lots[code.slice(0, code.lastIndexOf('-'))];
    const seq = parseInt(code.slice(-3), 10);
    if (!lot || seq < 1 || seq > lot.n) { scanFeedback(false, 'とうろく されていない ねふだ です。しょうひんの ボタンを つかってください。'); return; }
    if (lot.x && !settings().practiceMode) { scanFeedback(false, 'れんしゅう用の ねふだ です。ほんばんでは つかえません。'); return; }
    addToCart(lot.p, code);
    return;
  }
  const p = S.init.products.find(x => x.id === code) || S.init.products.find(x => x.id.toUpperCase() === code.toUpperCase());
  addToCart(p ? p.id : null, null);
}

/* ---- カメラ（QRコード） ---- */
let qr = null;
let facing = 'environment';   // 背面カメラを優先
let lastScan = { text: '', t: 0 };

async function toggleCamera() {
  if (qr) { await stopCamera(); return; }
  await startCamera();
}
function camRefs() { return REF.q || REF.step2; }
async function startCamera() {
  const R = camRefs();
  if (typeof Html5Qrcode === 'undefined') {
    scanFeedback(false, 'カメラの じゅんびが できませんでした。しょうひんの ボタンを つかってください。');
    return;
  }
  try {
    const fmts = typeof Html5QrcodeSupportedFormats !== 'undefined' ? [Html5QrcodeSupportedFormats.QR_CODE] : undefined;
    qr = new Html5Qrcode('reader', { formatsToSupport: fmts, experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
    await qr.start({ facingMode: facing },
      { fps: 25, disableFlip: true, qrbox: (w, hh) => { const s = Math.floor(Math.min(w, hh) * 0.8); return { width: Math.max(s, 120), height: Math.max(s, 120) }; } },
      onScan, () => {});
    if (R) { R.camBtn.textContent = '⏹ カメラを とめる'; R.flipBtn.hidden = false; }
  } catch (e) {
    qr = null;
    scanFeedback(false, 'カメラを つかえません。しょうひんの ボタンを つかってください。');
  }
}
async function stopCamera() {
  const q = qr;
  qr = null;
  const R = camRefs();
  if (R) { R.camBtn.textContent = '📷 カメラで よむ'; R.flipBtn.hidden = true; }
  if (q) { try { await q.stop(); q.clear(); } catch (e) { /* 無視 */ } }
}
async function flipCamera() {
  facing = facing === 'environment' ? 'user' : 'environment';
  await stopCamera();
  await startCamera();
}

function checkoutPayload() {
  const r = S.reg;
  const items = [];
  r.cart.forEach(l => {
    l.tags.forEach(t => items.push({ tagId: t }));
    const rest = l.qty - l.tags.length;
    if (rest > 0) items.push({ productId: l.id, qty: rest });
  });
  const g = S.register || {};
  return { txId: r.txId, memberId: r.member, segment: r.segment, tendered: r.tendered, items: items,
    channel: g.channel, booth: g.booth, registerName: g.registerName };
}

async function submitCheckout() {
  const r = S.reg;
  if (r.sending) return;                 // 連打を受け付けない
  if (!r.txId) r.txId = uuid();          // 同じ取引は同じIDで送る（再送しても二重にならない）
  r.sending = true; r.msg = null; render();
  const payload = checkoutPayload();
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const data = await api('POST', 'checkout', payload);
      r.sending = false; r.result = data;
      applySync({ stock: data.stock });
      (data.soldTags || []).forEach(t => S.sold.add(t));
      beep(true);
      r.step = 6; go('register');
      flushQueue();
      return;
    } catch (e) {
      if (e.code === 'BUSY' && attempt < 3) { await sleep(1000 * (attempt + 1)); continue; }
      r.sending = false;
      handleCheckoutError(e, payload);
      return;
    }
  }
}

function handleCheckoutError(e, payload) {
  const r = S.reg;
  switch (e.code) {
    case 'NETWORK':
    case 'SERVER': {
      // 記録されたかわからない・つながらない → 端末に保存して、あとで同じ取引IDで送る（10.1）
      const total = cartTotal();
      enqueue(payload, total);
      r.cart.forEach(l => { const p = prod(l.id); p.stock -= l.qty; l.tags.forEach(t => S.sold.add(t)); });
      store.set('init', S.init);
      r.result = { txId: r.txId, total: total, tendered: r.tendered, change: r.tendered - total, queued: true };
      beep(true);
      r.step = 6; go('register');
      return;
    }
    case 'OUT_OF_STOCK':
      r.txId = null;
      if (e.data && e.data.stock) applySync({ stock: e.data.stock });
      r.cart.forEach(l => {
        const p = prod(l.id);
        while (!canOversell() && l.qty > Math.max(0, p.stock) && l.qty > 0) { if (l.qty === l.tags.length) l.tags.pop(); l.qty--; }
      });
      r.cart = r.cart.filter(l => l.qty > 0);
      r.notice = { type: 'err', text: '✖ ' + e.message + '　カゴの こすうを なおしました。たしかめてください。' };
      beep(false); goStep(2); return;
    case 'ALREADY_SOLD':
    case 'UNKNOWN_TAG': {
      r.txId = null;
      const bad = (e.data && e.data.tags) || [];
      if (e.code === 'ALREADY_SOLD') bad.forEach(t => S.sold.add(t));
      r.cart.forEach(l => {
        const before = l.tags.length;
        l.tags = l.tags.filter(t => bad.indexOf(t) < 0);
        l.qty -= before - l.tags.length;
      });
      r.cart = r.cart.filter(l => l.qty > 0);
      r.notice = { type: 'err', text: '✖ ' + e.message + '　その ねふだを カゴから はずしました。' };
      beep(false); goStep(2); return;
    }
    case 'INSUFFICIENT_CASH':
      r.txId = null;
      r.notice = { type: 'err', text: '✖ ' + e.message };
      beep(false); goStep(4); return;
    case 'UNAUTHORIZED':
      toCodeScreen(); return;
    case 'NO_REGISTER':
      r.txId = null;
      S.register = null; saveRegister();
      openRegOpen(); S.ro.msg = { type: 'err', text: 'レジが ひらかれて いませんでした。レジを ひらいてから、もういちど うって ください（カゴは のこって いません）。' }; render();
      return;
    case 'BUSY':
      r.msg = { type: 'err', text: 'こみあって います。すこし まって、もういちど「決済する」を おしてください。' };
      beep(false); render(); return;
    default:
      r.txId = null;
      beep(false);
      if (e.data && e.data.field === 'member') { r.member = null; goStep(1); return; }
      if (e.data && e.data.field === 'segment') { r.segment = null; goStep(3); return; }
      if (e.data && e.data.field === 'booth') {
        r.cart = r.cart.filter(l => inBooth(prod(l.id)));
        r.notice = { type: 'err', text: '✖ ' + e.message + '　その しょうひんを カゴから はずしました。' };
        goStep(2); return;
      }
      r.msg = { type: 'err', text: e.message };
      render();
  }
}

async function submitProduction() {
  const d = S.pd;
  if (d.sending) return;
  if (!d.recordId) d.recordId = uuid();   // 同じ記録は同じIDで送る（再送しても二重にならない）
  d.sending = true; d.msg = null; render();
  try {
    const res = await api('POST', 'production', {
      recordId: d.recordId, memberId: d.member, productId: d.product, made: d.made, loss: d.loss, lossReason: d.reason, dept: d.dept || '',
    });
    d.sending = false; d.result = res;
    const p = prod(d.product);
    if (p && !res.duplicate && !(res.labels && res.labels.practice)) p.made += res.made;
    applySync({ stock: res.stock, lots: res.lots });
    beep(true);
    d.step = 5; go('production');
  } catch (e) {
    d.sending = false;
    if (e.code === 'UNAUTHORIZED') return toCodeScreen();
    if (e.code !== 'NETWORK' && e.code !== 'SERVER' && e.code !== 'BUSY') d.recordId = null;
    d.msg = { type: 'err', text: e.message + (e.code === 'NETWORK' || e.code === 'SERVER' ? '　もういちど「きろく する」を おしてください（2かい きろく される ことは ありません）。' : '') };
    beep(false); render();
  }
}

const LAYOUT_KEYS = ['cols', 'rows', 'w', 'h', 'top', 'left', 'gapX', 'gapY'];
const LABEL_PAD = 1.2;   // mm

function loadLayout() {
  const saved = store.get('labelLayout', null);
  if (saved && LAYOUT_KEYS.every(k => typeof saved[k] === 'number')) return saved;
  const s = String(settings().labelLayout || '').split(',').map(Number);
  if (s.length === 8 && s.every(n => isFinite(n))) {
    const o = { key: 'custom', name: 'せってい の すんぽう' };
    LAYOUT_KEYS.forEach((k, i) => { o[k] = s[i]; });
    return o;
  }
  return Object.assign({}, LABEL_PRESETS[1]);
}
function loadOffset() {
  const saved = store.get('labelOffset', null);
  if (saved && typeof saved.x === 'number') return saved;
  const s = String(settings().labelOffset || '0,0').split(',').map(Number);
  return { x: isFinite(s[0]) ? s[0] : 0, y: isFinite(s[1]) ? s[1] : 0 };
}
/** 二次元コード1辺（余白込み）の大きさ。余白を除いた本体が15mm以上必要 */
function qrSize(L) { return Math.min(L.h - 2 * LABEL_PAD, L.w * 0.45, 32); }
function layoutError(L) {

  if (!(L.w > 0 && L.h > 0) || L.top < 0 || L.left < 0 || L.gapX < 0 || L.gapY < 0) return 'すんぽうを たしかめて ください（0より大きい数）。';
  if (L.left + L.cols * L.w + (L.cols - 1) * L.gapX > 210.05) return 'よこが A4（210mm）を こえています。すんぽうを たしかめて ください。';
  if (L.top + L.rows * L.h + (L.rows - 1) * L.gapY > 297.05) return 'たてが A4（297mm）を こえています。すんぽうを たしかめて ください。';
  if (qrSize(L) * 25 / 33 < 15) return 'この ようしは ちいさすぎて、二次元コードを 15mm いじょうに できません。もっと 大きい ラベルを えらんで ください。';
  return '';
}
function isCompact(L) { return L.w < 60 || L.h < 30; }

function openLabelPrint(data, reprint, from) {

    data: data, reprint: reprint, from: from, layout: loadLayout(), offset: loadOffset(),

function saveLayout() { store.set('labelLayout', S.lab.layout); store.set('labelOffset', S.lab.offset); }

/** 二次元コード（誤り訂正レベルM、周りに4セルの余白）を SVG で作る */
function qrSvg(text, sizeMm) {
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  const n = q.getModuleCount(), m = 4, full = n + 2 * m;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return svg('svg', { class: 'qr', viewBox: '0 0 ' + full + ' ' + full, style: 'width:' + sizeMm + 'mm;height:' + sizeMm + 'mm', 'shape-rendering': 'crispEdges', role: 'img', 'aria-label': text },
    svg('rect', { width: full, height: full, fill: '#fff' }), svg('path', { d: d, fill: '#000' }));
}

function slotPos(L, off, slot) {
  const col = slot % L.cols, row = Math.floor(slot / L.cols);
  return { left: L.left + off.x + col * (L.w + L.gapX), top: L.top + off.y + row * (L.h + L.gapY) };
}
function labelBox(L, off, slot, frame) {
  const p = slotPos(L, off, slot);
  return h('div', { class: 'lbl' + (frame ? ' frame' : ''), style: 'left:' + p.left + 'mm;top:' + p.top + 'mm;width:' + L.w + 'mm;height:' + L.h + 'mm' });
}
/** 値札1枚：製品名・価格（いちばん大きく）・個体ID・製造日・製造元＋部署・二次元コード */
/** 値札に印刷する内容（製品名と値段はいつも。ほかは えらべる）。この端末に覚える */
const LABEL_FIELDS = [['tag', '個体番号'], ['date', '製造日'], ['org', '学校名'], ['dept', '学科']];
function labelFields() { return Object.assign({ tag: true, date: true, org: true, dept: true }, store.get('labelFields', {})); }
function labelFieldChips() {
  const f = labelFields();
  return h('div', { class: 'chips', role: 'group', 'aria-label': 'いんさつ する ないよう' },
    h('span', { class: 'btn chip selected', 'aria-disabled': 'true' }, '✓ 製品名'), h('span', { class: 'btn chip selected', 'aria-disabled': 'true' }, '✓ 値段'),
    h('span', { class: 'btn chip selected', 'aria-disabled': 'true' }, '✓ 二次元コード'),
    LABEL_FIELDS.map(([k, label]) => h('button', { class: 'btn chip' + (f[k] ? ' selected' : ''), 'aria-pressed': String(!!f[k]),
      onclick: () => { f[k] = !f[k]; store.set('labelFields', f); render(); } }, f[k] ? '✓ ' : '', label)));
}
function labelNode(data, tag, L, off, slot, frame) {
  const box = labelBox(L, off, slot, frame);
  const compact = isCompact(L);
  const F = labelFields();
  const f = compact ? { n: 6, p: 9.5, i: 4.6, d: 5, o: 5 } : { n: 8.5, p: 15, i: 6, d: 6.5, o: 6.5 };
  const org = compact ? (data.orgShort || data.org) : data.org;
  const bottom = [F.org ? org : '', F.dept ? data.dept : ''].filter(Boolean).join(' ');
  box.append(
    qrSvg(tag, qrSize(L)),
    h('div', { class: 't' },
      h('div', { style: 'font-size:' + f.n + 'pt;font-weight:700' }, data.practice ? '【練習】' : '', data.productName),
      h('div', { style: 'font-size:' + f.p + 'pt;font-weight:800' }, data.price.toLocaleString('ja-JP'), '円'),
      F.tag ? h('div', { class: 'i', style: 'font-size:' + f.i + 'pt' }, tag) : null,
      F.date ? h('div', { style: 'font-size:' + f.d + 'pt' }, compact ? '製造 ' + data.dateShort : '製造日 ' + data.date) : null,
      bottom ? h('div', { style: 'font-size:' + f.o + 'pt' }, bottom) : null));

}
function selectedTags() {
  const b = S.lab;
  if (b.data.multi) return b.data.multi.reduce((a, d) => a.concat(d.tags), []);
  if (b.range === 'all') return b.data.tags.slice();
  return b.data.tags.slice(b.rangeFrom - 1, b.rangeTo);
}
/** 印刷する値札の一覧：[{ data, tag }]（複数の製品をまとめて印刷できる） */
function selectedEntries() {
  const b = S.lab;
  if (b.data.multi) return b.data.multi.reduce((a, d) => a.concat(d.tags.map(t => ({ data: d, tag: t }))), []);
  return selectedTags().map(t => ({ data: b.data, tag: t }));
}
/** 印刷するページ（A4）を作る。試し刷りでは全部のラベル位置に枠線を引く */
function buildLabelSheets(onlyFirst) {
  const b = S.lab, L = b.layout, off = b.offset, per = L.cols * L.rows;
  const tags = selectedEntries();
  const trial = b.mode === 'trial';
  const sheets = [];
  let slot = b.start - 1, i = 0;
  while (i < tags.length || (!sheets.length && !tags.length)) {
    const sheet = h('div', { class: 'sheet' });
    const used = {};
    while (slot < per && i < tags.length) { sheet.append(labelNode(tags[i].data, tags[i].tag, L, off, slot, trial)); used[slot] = true; slot++; i++; }
    if (trial) for (let s = 0; s < per; s++) if (!used[s]) sheet.append(labelBox(L, off, s, true));
    sheets.push(sheet);
    slot = 0;
    if (onlyFirst || !tags.length) break;
  }
  return sheets;
}

/** 印刷用の領域に入れて印刷する */
function printNodes(nodes, pageCss) {
  document.getElementById('print-area').replaceChildren(...nodes);
  document.getElementById('page-style').textContent = pageCss;
  setTimeout(() => window.print(), 100);
}

 * ===================================================================== */
function saveTimers() { store.set('timers', S.timers); }
function openTimecard() {
  S.tc = { mode: 'list', member: null, task: null, minutes: 30, msg: null, sending: null, recordId: null };
  go('timecard');
}
function elapsedMin(t) { return Math.max(1, Math.round((Date.now() - t.start) / 60000)); }
function hhmm(ms) { const d = new Date(ms); return d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }

async function sendTimecard(recordId, member, task, minutes, dept) {
  return api('POST', 'timecard', { recordId: recordId, memberId: member, task: task, minutes: minutes, dept: dept || '' });
}
function memberDept(id) { const m = S.init.members.find(x => x.id === id); return m ? m.dept : ''; }
async function stopTimer(t) {
  const c = S.tc;
  if (c.sending) return;
  c.sending = t.id; c.msg = null; render();
  try {
    const res = await sendTimecard(t.id, t.member, t.task, Math.min(720, elapsedMin(t)), t.dept);
    S.timers = S.timers.filter(x => x.id !== t.id); saveTimers();
    c.msg = { type: 'ok', text: '✓ ' + memberName(t.member) + '：' + t.task + ' ' + res.minutes + 'ふん を きろく しました。' };
    beep(true);
  } catch (e) {
    if (e.code === 'UNAUTHORIZED') return toCodeScreen();
    c.msg = { type: 'err', text: e.message + '　もういちど「おわる」を おしてください。' };
    beep(false);
  }
  c.sending = null; render();
}

/** 期間の えらびかた → from・to（yyyy-MM-dd） */
function periodRange(kind) {
  const t = localDate(), y = +t.slice(0, 4), m = +t.slice(5, 7);
  const pad = n => ('0' + n).slice(-2);
  if (kind === 'month') return { from: y + '-' + pad(m) + '-01', to: t };
  if (kind === 'lastMonth') {
    const ly = m === 1 ? y - 1 : y, lm = m === 1 ? 12 : m - 1;
    return { from: ly + '-' + pad(lm) + '-01', to: ly + '-' + pad(lm) + '-' + pad(new Date(ly, lm, 0).getDate()) };
  }
  if (kind === 'year') {
    const fs = settings().fiscalStartMonth || 4, fy = m >= fs ? y : y - 1;
    return { from: fy + '-' + pad(fs) + '-01', to: t };
  }
  return { from: '', to: '' };
}

const SEGS = m => [
  { key: 'mat', label: 'ざいりょうひ', value: m.materialCost, fill: 'var(--mat)' },

];

function svg(tag, attrs, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  kids.forEach(k => el.append(typeof k === 'string' ? document.createTextNode(k) : k));
  return el;
}
function patternDefs() {
  return svg('defs', {},
    svg('pattern', { id: 'pt-lab', width: 10, height: 10, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
      svg('rect', { width: 10, height: 10, fill: '#6a1b9a' }), svg('rect', { width: 4, height: 10, fill: '#b48ccc' })),
    svg('pattern', { id: 'pt-exp', width: 8, height: 8, patternUnits: 'userSpaceOnUse' },
      svg('rect', { width: 8, height: 8, fill: '#4e5d66' }), svg('circle', { cx: 4, cy: 4, r: 1.8, fill: '#c9d2d8' })));
}

function chartSvg(m) {
  const W = 640, X0 = 130, BW = W - X0 - 16, BH = 46;
  const costs = m.materialCost + m.laborCost + m.expenses;
  const max = Math.max(m.sales, costs, 1);
  const sc = v => Math.max(0, v) / max * BW;
  const loss = m.operatingProfit < 0;
  const summary = '売上高 ' + yen(m.sales) + '。材料費 ' + yen(m.materialCost) + '、人件費 ' + yen(m.laborCost) +
    (m.expenses ? '、経費 ' + yen(m.expenses) : '') + '。営業利益 ' + yen(m.operatingProfit) + '。';
  const el = svg('svg', { viewBox: '0 0 ' + W + ' ' + (loss ? 200 : 176), role: 'img', 'aria-label': summary }, patternDefs());

  // 1本目：売上高
  el.append(svg('text', { x: X0 - 10, y: 50, 'text-anchor': 'end', 'font-size': 18, 'font-weight': 700, fill: '#1a1a1a' }, 'うりあげ'));
  el.append(svg('rect', { x: X0, y: 24, width: sc(m.sales), height: BH, fill: 'var(--sal)', rx: 4 }));
  // 2本目：使い道（材料費・人件費・経費・もうけ）
  el.append(svg('text', { x: X0 - 10, y: 134, 'text-anchor': 'end', 'font-size': 18, 'font-weight': 700, fill: '#1a1a1a' }, 'つかいみち'));
  let x = X0;
  SEGS(m).forEach(s => {
    const w = sc(s.value);
    if (w <= 0) return;
    el.append(svg('rect', { x: x, y: 108, width: w, height: BH, fill: s.fill, stroke: '#fff', 'stroke-width': 2 }));
    if (w > 90) el.append(svg('text', { x: x + w / 2, y: 137, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 700, fill: '#fff', stroke: '#000', 'stroke-width': 3, 'paint-order': 'stroke' }, s.label));
    x += w;
  });
  if (loss) {
    // 売上高の位置に線を引き、はみ出した部分を「赤字」と示す
    const xs = X0 + sc(m.sales);
    el.append(svg('line', { x1: xs, y1: 16, x2: xs, y2: 162, stroke: '#b3261e', 'stroke-width': 3, 'stroke-dasharray': '6 4' }));
    el.append(svg('text', { x: W - 10, y: 188, 'text-anchor': 'end', 'font-size': 17, 'font-weight': 800, fill: '#b3261e' },
      '▲ あかじ ' + yen(-m.operatingProfit)));
  }
  return el;
}
function chartLegend(m) {
  const items = [{ label: 'うりあげ', value: m.sales, fill: 'var(--sal)' }]
    .concat(SEGS(m).filter(s => (s.key !== 'exp' || s.value > 0) && (s.key !== 'pro' || m.operatingProfit >= 0)));
  const list = items.map(s => {
    // 模様はグラフ本体の定義（#pt-lab / #pt-exp）を参照する
    const sw = svg('svg', { viewBox: '0 0 22 22', 'aria-hidden': 'true' }, svg('rect', { width: 22, height: 22, fill: s.fill, rx: 3 }));
    return h('li', null, sw, s.label, '：', yen(s.value));
  });
  if (m.operatingProfit < 0) {
    const sw = svg('svg', { viewBox: '0 0 22 22', 'aria-hidden': 'true' },
      svg('line', { x1: 11, y1: 0, x2: 11, y2: 22, stroke: '#b3261e', 'stroke-width': 3, 'stroke-dasharray': '4 3' }));
    list.push(h('li', { style: 'color:var(--stop);font-weight:800' }, sw, 'あかじ（うりあげを こえた ぶん）：', yen(-m.operatingProfit)));
  }
  return h('ul', { class: 'legend' }, list);
}

/** これまでの 1日あたりの売れた数から、予想の めやすを出す */
function suggestForecast(p, channel) {
  if (!p) return null;
  const rows = p.byChannel.filter(c => !channel || c.channel === channel);
  if (!rows.length) return null;
  const days = rows.reduce((a, c) => a + c.days, 0), qty = rows.reduce((a, c) => a + c.qty, 0);
  return days ? Math.round(qty / days) : null;
}
function pickPlanProduct(id) {
  const x = S.pl;
  const p = x.data.products.find(q => q.id === id) || null;
  const prev = x.sim || {};
  const made = p ? Math.max(10, Math.ceil((suggestForecast(p, prev.channel) || 10) * 1.2)) : 20;
  x.sim = {
    productId: p ? p.id : '', name: p ? p.name : (prev.productId === '' ? prev.name : ''),
    price: p ? p.price : 100, cost: p ? Math.round(p.cost) : 40, made: made,
    forecast: p ? Math.min(made, suggestForecast(p, prev.channel) || Math.round(made * 0.8)) : 16,

/** 予想の計算（純粋な関数） */
function planCalc(m, wage) {
  const sold = Math.min(m.forecast, m.made);

  const labor = Math.round(m.minutes / 60 * wage);
  const fixed = labor + m.expenses;
  const bep = unitMargin > 0 ? Math.ceil(fixed / unitMargin) : null;
  const sales = m.price * sold;
  const material = m.cost * m.made;

  const profit = sales - material - fixed;

const DRILL_SETS = {
  '販売': ['change', 'total', 'salesCheck'],
  '会計・総務': ['expected', 'overShort', 'profit'],
  '商品企画': ['margin', 'bep', 'targetQty'],
  '生産': ['canMake', 'workTime', 'goodRate'],
  '仕入・在庫': ['stock', 'need', 'packs'],
  '経営': ['profit', 'bep', 'labor', 'margin'],
};
function makeDrill(dept, level, count) {
  const types = DRILL_SETS[dept] || DRILL_SETS['販売'];
  const out = [];
  for (let i = 0; i < count; i++) {
    const key = types[i % types.length];
    const q = DRILL_GEN[key].gen(level);
    out.push(Object.assign({ key: key, type: DRILL_GEN[key].label, level: level }, q));
  }
  return out.sort(() => Math.random() - 0.5);
}
/* ---------- 練習問題の画面（時間制限なし。2回まちがえたら こたえを見られる） ---------- */
function openDrill(dept) {
  const d = DRILL_SETS[dept] ? dept : '販売';
  S.dr = { phase: 'setup', dept: d, level: effLevel(), count: 5, member: store.get('member', '') || '', msg: null };
  go('drill');
}
function startDrill() {
  const x = S.dr;
  x.qs = makeDrill(x.dept, x.level, x.count);
  x.i = 0; x.input = ''; x.tries = 0; x.state = 'ask'; x.results = []; x.showHint = false; x.recordId = uuid(); x.sent = null;
  x.phase = 'q';
  render();
}
function drillKey(k) {
  const x = S.dr;
  if (x.state !== 'ask' && x.state !== 'wrong') return;
  if (k === 'back') x.input = x.input.slice(0, -1);
  else if (k === 'clear') x.input = '';
  else if (k === '-') x.input = x.input.startsWith('-') ? x.input.slice(1) : '-' + x.input;
  else if (x.input.replace('-', '').length < 9) x.input = (x.input === '0' ? '' : x.input === '-0' ? '-' : x.input) + k;
  if (x.state === 'wrong') x.state = 'ask';
  render();
}
function drillAnswer() {
  const x = S.dr, q = x.qs[x.i];
  if (x.input === '' || x.input === '-') return;
  x.tries += 1;
  if (Number(x.input) === q.answer) {
    x.state = 'right'; beep(true);
    x.results.push({ type: q.type, level: q.level, correct: true, tries: x.tries });
  } else {
    x.state = 'wrong'; beep(false);
  }
  render();
}
function drillReveal() {
  const x = S.dr, q = x.qs[x.i];
  x.state = 'shown';
  x.results.push({ type: q.type, level: q.level, correct: false, tries: x.tries });
  render();
}
function drillNext() {
  const x = S.dr;
  if (x.i + 1 >= x.qs.length) { x.phase = 'done'; render(); sendDrill(); return; }
  x.i += 1; x.input = ''; x.tries = 0; x.state = 'ask'; x.showHint = false;
  render();
}
async function sendDrill() {
  const x = S.dr;
  try {
    await api('POST', 'drill', { recordId: x.recordId, dept: x.dept, memberId: x.member, results: x.results });
    x.sent = 'ok';
  } catch (e) { x.sent = 'ng'; }
  if (S.screen === 'drill') render();
}

    if (!isFinite(v) || v < 0) v = 0;

  return h('div', { class: 'field' }, h('label', { for: id }, label), h('span', null, el, ' ', o.unit), o.hint ? h('small', { class: 'muted' }, '　', o.hint) : null);

    acceptNode: n => (n.parentElement && n.parentElement.closest(L10N_SKIP)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => { const v = l10nText(n.nodeValue, lv); if (v !== n.nodeValue) n.nodeValue = v; });
  // かたまりの さかいめの わかち書き（「どの 」＋ふりがなつきの「部門」など）も つめる
  const JP = /[\u3000-\u30ff\u3400-\u9fff\uff01-\uffef]/;
  const near = sib => !sib ? '' : sib.nodeType === 3 ? sib.nodeValue : (sib.textContent || '');
  nodes.forEach(n => {
    let v = n.nodeValue;
    if (v.length > 1 && v.endsWith(' ') && JP.test(v[v.length - 2])) { const nx = near(n.nextSibling); if (nx && (JP.test(nx[0]) || /\d/.test(nx[0]))) v = v.slice(0, -1); }
    if (v.length > 1 && v.startsWith(' ') && JP.test(v[1])) { const pv = near(n.previousSibling); if (pv && JP.test(pv[pv.length - 1])) v = v.slice(1); }
    if (v !== n.nodeValue) n.nodeValue = v;
  });
  root.querySelectorAll('[placeholder]').forEach(el => { el.placeholder = l10nText(el.placeholder, lv); });
}

  go('qsales');
  flushQueue();
  try { S.qs.data = await api('GET', 'sales', { scope: S.qs.scope, channel: quickEvent() }); }
  catch (e) { if (e.code === 'UNAUTHORIZED') return toCodeScreen(); S.qs.error = e; }
  S.qs.loading = false;
  if (S.screen === 'qsales') render();
}
VIEWS.qsales = () => {
  const x = S.qs, ev = quickEvent();
  const title = ['💴 うりあげの かくにん（', ev, '）'];
  const head = [chips([['today', 'きょう'], ['all', 'これまで ぜんぶ']], x.scope, v => openQuickSales(v), 'きかん'),
    h('div', { class: 'row', style: 'margin-top:8px' },
      h('button', { class: 'btn go', onclick: () => openQuickSales() }, '🔄 さいしんに する'),
      h('button', { class: 'btn ok', onclick: () => { S.backTo = 'qsales'; openClosing(); } }, '🔒 レジじめ（1だい ずつ）'),
      h('button', { class: 'btn', onclick: () => { S.backTo = 'qsales'; JOBS.void.open(); } }, '↩ とりけし'))];
  if (x.loading) return page(title, () => go('quick'), head, h('p', { class: 'big', role: 'status' }, 'よみこみ ちゅう…'));
  if (x.error) return page(title, () => go('quick'), head, note('err', x.error.message));
  const d = x.data;
  const waiting = S.queue.filter(q => q.status === 'waiting').length;
  const num = v => h('td', { class: 'num' }, v);
  const tbl = (cols, rows) => h('div', { style: 'overflow-x:auto' }, h('table', { class: 'tbl' },
    h('thead', null, h('tr', null, cols.map((c, i) => h('th', { class: i ? 'num' : null }, c)))), h('tbody', null, rows)));
  return page(title, () => go('quick'), head,
    waiting ? note('', 'この たんまつに まだ おくって いない とりひきが ' + waiting + 'けん あります。おくり おわると ここに はいります。') : null,
    h('div', { class: 'sum3' },
      h('div', { class: 'kv' }, h('div', { class: 'k' }, rb('売上', 'うりあげ')), h('div', { class: 'money' }, yen(d.total.sales))),
      h('div', { class: 'kv' }, h('div', { class: 'k' }, 'おきゃくさんの かず（とりひき）'), h('div', { class: 'money' }, d.total.txCount, 'けん')),
      h('div', { class: 'kv' }, h('div', { class: 'k' }, 'うれた こすう'), h('div', { class: 'money' }, d.total.qty, 'こ'))),
    h('h3', null, 'レジ ごと'),
    d.registers.length ? tbl(['レジ', 'とりひき', 'こすう', '売上'], d.registers.map(r => h('tr', null,
      h('td', null, x.scope === 'all' ? r.date.slice(5).replace('-', '/') + '　' : '', r.label), num(r.txCount + 'けん'), num(r.qty + 'こ'), num(yen(r.sales)))))
      : h('p', { class: 'muted' }, 'まだ うりあげは ありません。'),
    quickByDept() ? [h('h3', null, rb('科', 'か'), 'ごと'),
      tbl([rb('科', 'か'), 'とりひき', 'こすう', '売上'], d.depts.map(r => h('tr', null, h('td', null, r.label), num(r.txCount + 'けん'), num(r.qty + 'こ'), num(yen(r.sales)))))] : null,
    h('h3', null, 'しょうひん ごと'),
    tbl(['しょうひん', 'こすう', '売上'], d.products.filter(p => p.qty || p.sales).map(p => h('tr', null,
      h('td', null, p.icon ? p.icon + ' ' : '', p.label, h('small', { class: 'muted' }, '（', p.dept || '科なし', '）')), num(p.qty + 'こ'), num(yen(p.sales))))),
    h('p', { class: 'muted', style: 'font-size:0.85rem' }, 'とりけしは さしひいて います。とりけしと レジじめには せんせいの あんしょう ばんごうが いります。'),
    versionLine());
};

/* すべての定義を読み込んでから起動する */
boot();
</script>
